<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 Playoff Probability Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple-50: #EEEDFE;
            --purple-600: #534AB7;
            --purple-800: #3C3489;
            --teal-50: #E1F5EE;
            --teal-600: #0F6E56;
            --teal-800: #085041;
            --gray-50: #F1EFE8;
            --gray-100: #D3D1C7;
            --gray-600: #5F5E5A;
            --gray-800: #444441;
            --blue-50: #E6F1FB;
            --blue-600: #185FA5;
            --blue-800: #0C447C;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 2rem;
        }

        .current-standings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .team-card {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .team-card:hover {
            border-color: var(--purple-600);
            transform: translateY(-2px);
        }

        .team-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--gray-800);
            margin-bottom: 0.5rem;
        }

        .team-points {
            font-size: 2rem;
            font-weight: 700;
            color: var(--purple-600);
        }

        .points-label {
            font-size: 0.85rem;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .matches-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid var(--purple-600);
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .match-card {
            background: var(--blue-50);
            border-radius: 12px;
            padding: 1rem;
            border: 2px solid var(--blue-600);
        }

        .match-date {
            font-size: 0.8rem;
            color: var(--blue-800);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--gray-800);
        }

        .vs {
            color: var(--gray-600);
            font-weight: 400;
        }

        .calculate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1.25rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .calculate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-section {
            display: none;
        }

        .results-section.visible {
            display: block;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .result-card {
            background: linear-gradient(135deg, var(--teal-50) 0%, var(--blue-50) 100%);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid var(--teal-600);
            position: relative;
            overflow: hidden;
        }

        .result-rank {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: var(--purple-600);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .result-team {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 0.5rem;
        }

        .result-probability {
            font-size: 3rem;
            font-weight: 700;
            color: var(--teal-800);
            margin-bottom: 0.25rem;
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--teal-600);
            border-radius: 4px;
            transition: width 1s ease;
        }

        .stats-info {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--gray-800);
        }

        .stats-info strong {
            color: var(--purple-600);
            font-size: 1.2rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-radius: 50%;
            border-top: 4px solid #667eea;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .qualifier-badge {
            display: inline-block;
            background: var(--teal-600);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.visible {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .match-result-input {
            background: var(--blue-50);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .match-info {
            text-align: center;
            margin-bottom: 1rem;
            color: var(--gray-800);
        }

        .match-info-date {
            font-size: 0.85rem;
            color: var(--blue-800);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .match-info-teams {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .winner-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .winner-btn {
            background: white;
            border: 2px solid var(--blue-600);
            color: var(--blue-800);
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .winner-btn:hover {
            background: var(--blue-50);
            transform: translateY(-2px);
        }

        .winner-btn.selected {
            background: var(--blue-600);
            color: white;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-btn {
            flex: 1;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
        }

        .modal-btn-secondary {
            background: var(--gray-100);
            color: var(--gray-800);
        }

        .modal-btn-secondary:hover {
            background: var(--gray-600);
            color: white;
        }

        .completed-match {
            opacity: 0.6;
            position: relative;
        }

        .completed-match::after {
            content: '✓ Completed';
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: var(--teal-600);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .winner-indicator {
            font-weight: 700;
            color: var(--teal-600);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 1.5rem;
            }

            .current-standings {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .modal-content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Modal for match results -->
    <div class="modal" id="matchResultModal">
        <div class="modal-content">
            <h2 class="modal-title">Enter Match Results</h2>
            <div id="matchResultsContainer">
                <!-- Populated by JS -->
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="submitMatchResults()">Update & Calculate</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>🏏 IPL 2026 Playoff Predictor</h1>
            <p class="subtitle">Simulate all possible match outcomes and discover each team's playoff probability</p>
        </header>

        <div class="card">
            <h2 class="section-title">Current Standings</h2>
            <div class="current-standings" id="standings">
                <!-- Populated by JS -->
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">Remaining Matches</h2>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <p style="color: var(--gray-600); font-size: 0.95rem;">
                    <span id="remainingCount">27</span> matches remaining
                    <span id="completedCount" style="margin-left: 1rem;"></span>
                </p>
                <button onclick="location.reload()"> Refresh Results
                </button>
            </div>
            <div class="match-grid" id="matches">
                <!-- Populated by JS -->
            </div>
        </div>

        <div class="card">
<button class="calculate-btn" id="calculateBtn" onclick="calculateProbabilities()">                Calculate Playoff Probabilities
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Simulating all possible match outcomes...</p>
            <p style="font-size: 0.9rem; color: #666; margin-top: 0.5rem;">This may take a moment</p>
        </div>

        <div class="results-section" id="results">
            <div class="card">
                <h2 class="section-title">Playoff Qualification Probabilities</h2>
                <div class="stats-info" id="statsInfo"></div>
                <div class="results-grid" id="resultsGrid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        
// API ENDPOINTS
const POINTS_API = "https://site.api.espncricinfo.com/apis/v2/sports/cricket/ipl/standings";
const FIXTURES_API = "https://site.api.espncricinfo.com/apis/v2/sports/cricket/ipl/schedule";
         let teams = {};
let allMatches = [];

         

        let completedMatches = [];
        let remainingMatches = [];
        let pendingMatches = [];

        const teamNames = {
            "MI": "Mumbai Indians",
            "CSK": "Chennai Super Kings",
            "RCB": "Royal Challengers Bangalore",
            "KKR": "Kolkata Knight Riders",
            "DC": "Delhi Capitals",
            "SRH": "Sunrisers Hyderabad",
            "RR": "Rajasthan Royals",
            "PBKS": "Punjab Kings",
            "GT": "Gujarat Titans",
            "LSG": "Lucknow Super Giants"
        };

        let matchResultsInput = {};

        // Initialize on page load
async function init() {

    await fetchIPLData();

    displayStandings();

    displayMatches();
}
 async function fetchIPLData() {
    try {

      const response = await fetch(

);
const text = await response.text();

console.log(text);
const data = JSON.parse(text);
        // RESET
        teams = {};
        allMatches = [];
        completedMatches = [];
        remainingMatches = [];
 
        // -----------------------------
        // CREATE EMPTY POINTS TABLE
        // -----------------------------
        Object.keys(teamNames).forEach(team => {
            teams[team] = 0;
        });

        // -----------------------------
        // READ MATCHES FROM API
        // -----------------------------
        const matches = data.matches;

        Object.values(matches).forEach(match => {

            const team1 = match.team_1;
            const team2 = match.team_2;

            if (!team1 || !team2) return;
 if (team1 === "TBA" || team2 === "TBA") return;
            // Convert date
            let matchDate = "2026-05-01";

            if (match.start_time_utc) {
                matchDate = match.start_time_utc.split("T")[0];
            }

            allMatches.push([
                team1,
                team2,
                matchDate
            ]);

            // -----------------------------
            // COMPLETED MATCH
            // -----------------------------
            if (match.status === "Completed") {

                let winner = null;

                // Detect winner from result text
                if (match.result.includes(team1)) {
                    winner = team1;
                }
                else if (match.result.includes(team2)) {
                    winner = team2;
                }

                if (winner) {

                    // ADD POINTS
                    teams[winner] += 2;

                    completedMatches.push([
                        team1,
                        team2,
                        matchDate,
                        winner
                    ]);
                }
            }

            // -----------------------------
            // UPCOMING / LIVE MATCH
            // -----------------------------
            else {

                remainingMatches.push([
                    team1,
                    team2,
                    matchDate
                ]);
            }
        });

        console.log("Teams:", teams);
        console.log("Completed:", completedMatches);
        console.log("Remaining:", remainingMatches);

    } catch (err) {

        console.error("API Error:", err);

        alert("Failed to fetch IPL data");
    }
}
        // Fetch fixtures
  
        // Categorize matches based on current date
        function categorizeMatches() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            allMatches.forEach(match => {
                const matchDate = new Date(match[2]);
                matchDate.setHours(0, 0, 0, 0);

                if (matchDate < today) {
                    pendingMatches.push(match);
                } else {
                    remainingMatches.push(match);
                }
            });
        }

        // Show modal for match results

        // Display current standings
function displayStandings() {
    const standingsDiv = document.getElementById('standings');

    standingsDiv.innerHTML = '';

    const sortedTeams = Object.entries(teams)
        .sort((a, b) => b[1] - a[1]);

    sortedTeams.forEach(([team, points]) => {

        const card = document.createElement('div');

        card.className = 'team-card';

        card.innerHTML = `
            <div class="team-name">${team}</div>
            <div class="team-points">${points}</div>
            <div class="points-label">Points</div>
        `;

        standingsDiv.appendChild(card);
    });
}
        // Display matches
        function displayMatches() {
            const matchesDiv = document.getElementById('matches');
            matchesDiv.innerHTML = '';
            
            // Update counts
            document.getElementById('remainingCount').textContent = remainingMatches.length;
            const completedCountEl = document.getElementById('completedCount');
            if (completedMatches.length > 0) {
                completedCountEl.textContent = `| ${completedMatches.length} completed`;
                completedCountEl.style.color = 'var(--teal-600)';
            }
            
            // Display completed matches first
            completedMatches.forEach(([team1, team2, date, winner]) => {
                const formattedDate = new Date(date).toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric' 
                });
                
                const card = document.createElement('div');
                card.className = 'match-card completed-match';
                card.innerHTML = `
                    <div class="match-date">${formattedDate}</div>
                    <div class="match-teams">
                        <span class="${winner === team1 ? 'winner-indicator' : ''}">${team1}</span>
                        <span class="vs">vs</span>
                        <span class="${winner === team2 ? 'winner-indicator' : ''}">${team2}</span>
                    </div>
                `;
                matchesDiv.appendChild(card);
            });

            // Display remaining matches
            remainingMatches.forEach(([team1, team2, date]) => {
                const formattedDate = new Date(date).toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric' 
                });
                
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-date">${formattedDate}</div>
                    <div class="match-teams">
                        <span>${team1}</span>
                        <span class="vs">vs</span>
                        <span>${team2}</span>
                    </div>
                `;
                matchesDiv.appendChild(card);
            });
        }

        // Calculate probabilities
        let calculationResults = {};

        function calculateProbabilities() {
            // Show loading
            document.getElementById('calculateBtn').disabled = true;
            document.getElementById('loading').classList.add('visible');
            document.getElementById('results').classList.remove('visible');

            // Reset results
            const qualificationCounts = {};
            Object.keys(teams).forEach(team => {
                qualificationCounts[team] = 0;
            });

            let totalScenarios = 0;

            // Use setTimeout to allow UI to update
            setTimeout(() => {
                // Generate all possible outcomes for remaining matches
                const totalMatches = remainingMatches.length;
                const totalCombinations = Math.pow(2, totalMatches);

                for (let scenario = 0; scenario < totalCombinations; scenario++) {
                    // Create a copy of current points
                    const points = { ...teams };

                    // For each remaining match, determine winner based on binary representation
                    for (let matchIndex = 0; matchIndex < totalMatches; matchIndex++) {
                        const bit = (scenario >> matchIndex) & 1;
                        const winner = bit === 0 ? remainingMatches[matchIndex][0] : remainingMatches[matchIndex][1];
                        points[winner] += 2;
                    }

                    // Find top 4 teams
                    const sortedTeams = Object.entries(points).sort((a, b) => b[1] - a[1]);
                    const top4 = sortedTeams.slice(0, 4);

                    // Increment qualification count for top 4
                    top4.forEach(([team, pts]) => {
                        qualificationCounts[team]++;
                    });

                    totalScenarios++;
                }

                // Calculate percentages
                calculationResults = {};
                Object.keys(qualificationCounts).forEach(team => {
                    calculationResults[team] = (qualificationCounts[team] / totalScenarios * 100).toFixed(2);
                });

                displayResults(totalScenarios);

                // Hide loading
                document.getElementById('loading').classList.remove('visible');
                document.getElementById('calculateBtn').disabled = false;
            }, 100);
        }

        function displayResults(totalScenarios) {
            const resultsDiv = document.getElementById('resultsGrid');
            const statsDiv = document.getElementById('statsInfo');
            resultsDiv.innerHTML = '';

            // Display stats
            statsDiv.innerHTML = `
                <p>Analyzed <strong>${totalScenarios.toLocaleString()}</strong> possible scenarios</p>
                <p style="margin-top: 0.5rem; font-size: 0.9rem;">Based on ${remainingMatches.length} remaining matches</p>
                ${completedMatches.length > 0 ? `<p style="margin-top: 0.5rem; font-size: 0.9rem; color: var(--teal-600);">${completedMatches.length} matches completed</p>` : ''}
            `;

            // Sort by probability
            const sortedResults = Object.entries(calculationResults).sort((a, b) => parseFloat(b[1]) - parseFloat(a[1]));

            sortedResults.forEach(([team, probability], index) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                const isQualifier = index < 4;
                
                card.innerHTML = `
                    <div class="result-rank">${index + 1}</div>
                    <div class="result-team">${team}</div>
                    <div class="result-probability">${probability}%</div>
                    <div class="result-label">Playoff Probability</div>
                    ${isQualifier ? '<div class="qualifier-badge">Strong Qualifier</div>' : ''}
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${probability}%"></div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });

            document.getElementById('results').classList.add('visible');
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Initialize on page load
        window.onload = init;
    </script>
